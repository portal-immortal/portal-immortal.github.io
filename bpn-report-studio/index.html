<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BPN Report Studio</title>
  <meta name="description" content="Buat dan kelola rekaman Bukti Penerimaan Negara (BPN) untuk Pajak, Bea Cukai, dan PNBP — langsung dari peramban, tanpa server." />

  <!-- Bootstrap 5 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <!-- Type: Source Serif 4 (display), Inter (body), IBM Plex Mono (codes/ledger data) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

  <link rel="stylesheet" href="assets/css/styles.css" />

  <!-- favicon (inline ledger-mark SVG, no external asset needed) -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%226%22 fill=%22%230F2A4A%22/><text x=%2216%22 y=%2222%22 font-size=%2214%22 font-family=%22monospace%22 fill=%22%23D9AE5F%22 text-anchor=%22middle%22>BPN</text></svg>" />
</head>
<body>

  <div class="bpn-app-shell">

    <!-- Sidebar (offcanvas on mobile, fixed rail from lg breakpoint up) -->
    <div class="offcanvas offcanvas-lg offcanvas-start bpn-sidebar" tabindex="-1" id="app-sidebar-offcanvas">
      <div class="offcanvas-header d-lg-none">
        <span class="bpn-brand"><i class="bi bi-journal-check"></i> BPN Report Studio</span>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" data-bs-target="#app-sidebar-offcanvas" aria-label="Tutup"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column p-0">
        <div class="bpn-brand d-none d-lg-flex">
          <i class="bi bi-journal-check"></i>
          <span>BPN Report Studio</span>
        </div>

        <nav class="bpn-nav flex-grow-1">
          <a href="#/dashboard" class="bpn-nav-link" data-nav-link="dashboard">
            <i class="bi bi-grid-1x2"></i><span>Dashboard</span>
          </a>
          <a href="#/create" class="bpn-nav-link" data-nav-link="create">
            <i class="bi bi-file-earmark-plus"></i><span>Buat Laporan</span>
          </a>
          <a href="#/data" class="bpn-nav-link" data-nav-link="data">
            <i class="bi bi-arrow-left-right"></i><span>Impor &amp; Ekspor</span>
          </a>
          <a href="#/settings" class="bpn-nav-link" data-nav-link="settings">
            <i class="bi bi-gear"></i><span>Pengaturan</span>
          </a>
          <a href="#/about" class="bpn-nav-link" data-nav-link="about">
            <i class="bi bi-info-circle"></i><span>Tentang</span>
          </a>
        </nav>

        <div class="bpn-sidebar-footer">
          <div class="bpn-ledger-rule"></div>
          <span>BPN Report Studio v1.0.0</span>
        </div>
      </div>
    </div>

    <!-- Main column -->
    <div class="bpn-main">
      <header class="bpn-topbar">
        <button class="btn bpn-icon-btn d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#app-sidebar-offcanvas" aria-label="Buka menu">
          <i class="bi bi-list"></i>
        </button>
        <a href="#/dashboard" class="btn bpn-icon-btn" title="Ke Dashboard" aria-label="Ke Dashboard">
          <i class="bi bi-house-door"></i>
        </a>
        <h1 class="bpn-page-title" id="page-title">Dashboard</h1>
        <div class="ms-auto d-flex align-items-center gap-2">
          <button class="btn bpn-icon-btn" type="button" id="btn-quick-theme" title="Ganti tema">
            <i class="bi bi-moon-stars"></i>
          </button>
          <a href="#/create" class="btn bpn-btn-primary btn-sm d-none d-sm-inline-flex align-items-center">
            <i class="bi bi-plus-lg me-1"></i>Laporan Baru
          </a>
        </div>
      </header>

      <div id="storage-warning-banner" class="alert alert-warning rounded-0 mb-0 d-none py-2 px-3 small" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span id="storage-warning-text"></span>
      </div>

      <main class="bpn-content" id="app-content">
        <!-- view templates are injected here by the router -->
      </main>

      <footer class="bpn-footer">
        <span>&copy; <span id="footer-year"></span> BPN Report Studio — dijalankan sepenuhnya di peramban Anda.</span>
      </footer>
    </div>
  </div>

  <!-- Toast stack -->
  <div id="toast-stack" class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 1080;"></div>

  <!-- Shared confirmation modal -->
  <div class="modal fade" id="confirm-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="confirm-modal-title">Konfirmasi</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Tutup"></button>
        </div>
        <div class="modal-body" id="confirm-modal-message">Apakah Anda yakin?</div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Batal</button>
          <button type="button" class="btn btn-danger" id="confirm-modal-confirm">Ya, lanjutkan</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap bundle (includes Popper) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- jsPDF (the app's one runtime dependency, used for Generate PDF and merged batch downloads) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!--
    Every app file below is a plain script (not type="module") that
    publishes its API onto the shared `window.BPN` namespace, in dependency
    order. This is deliberate: ES module scripts are blocked by the
    browser's CORS policy when a page is opened directly via file:// (i.e.
    by double-clicking index.html), which is the primary way this app is
    meant to run. Plain scripts have no such restriction.
  -->

  <!-- config -->
  <script src="assets/js/config/config.js"></script>
  <script src="assets/js/config/billing-prefix.js"></script>
  <script src="assets/js/config/field-definition.js"></script>
  <script src="assets/js/config/report-definition.js"></script>

  <!-- utils -->
  <script src="assets/js/utils/formatter.js"></script>
  <script src="assets/js/utils/terbilang.js"></script>
  <script src="assets/js/utils/router.js"></script>

  <!-- templates (needed by services/pdf.js) -->
  <script src="templates/bpn-template.js"></script>

  <!-- services -->
  <script src="assets/js/services/storage.js"></script>
  <script src="assets/js/services/report.js"></script>
  <script src="assets/js/services/validation.js"></script>
  <script src="assets/js/services/csv.js"></script>
  <script src="assets/js/services/pdf.js"></script>

  <!-- components -->
  <script src="assets/js/components/form-engine.js"></script>
  <script src="assets/js/components/data-table.js"></script>
  <script src="assets/js/components/toast.js"></script>
  <script src="assets/js/components/modal.js"></script>
  <script src="assets/js/components/sidebar.js"></script>

  <!-- views -->
  <script src="assets/js/views/dashboard.js"></script>
  <script src="assets/js/views/create-report.js"></script>
  <script src="assets/js/views/preview-report.js"></script>
  <script src="assets/js/views/data-io.js"></script>
  <script src="assets/js/views/settings.js"></script>
  <script src="assets/js/views/about.js"></script>

  <!-- app bootstrap — must load last -->
  <script src="assets/js/app.js"></script>
</body>
</html>
